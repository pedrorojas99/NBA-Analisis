name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set unique Android build number
        run: |
          sed -i "s/^version:.*/version: 0.3.0+${GITHUB_RUN_NUMBER}/" pubspec.yaml
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --project-name nba_analytics .
      - name: Set NBA Analytics launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#EF6C35"
                  android:fillType="evenOdd" android:pathData="M54,5 L7,103 L31,103 L41,81 L67,81 L77,103 L101,103 Z M54,43 L43,69 L65,69 Z"/>
              <path android:fillColor="@android:color/transparent" android:strokeColor="#252B33"
                  android:strokeWidth="4" android:strokeLineCap="round"
                  android:pathData="M51,9 C38,34 27,63 15,91"/>
              <path android:fillColor="@android:color/transparent" android:strokeColor="#252B33"
                  android:strokeWidth="4" android:strokeLineCap="round"
                  android:pathData="M57,9 C70,34 81,63 93,91"/>
              <path android:fillColor="@android:color/transparent" android:strokeColor="#252B33"
                  android:strokeWidth="4" android:strokeLineCap="round"
                  android:pathData="M35,68 L73,68"/>
          </vector>
          EOF
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/ic_launcher"|' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' android/app/src/main/AndroidManifest.xml
      - run: rm -rf test
      - run: flutter pub get
      - run: flutter analyze lib --no-fatal-infos
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: nba-analytics-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish APK for in-app updates
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NBA Analytics build ${{ github.run_number }}
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
