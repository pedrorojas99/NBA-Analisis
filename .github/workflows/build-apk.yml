name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set unique Android build number
        run: |
          sed -i "s/^version:.*/version: 0.3.0+${GITHUB_RUN_NUMBER}/" pubspec.yaml
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --project-name nba_analytics .
      - run: rm -f test/widget_test.dart
      - name: Set NBA Analytics launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#E8752E" android:pathData="M54,4 A50,50 0,1 0,54 104 A50,50 0,1 0,54 4"/>
              <path android:fillColor="@android:color/transparent" android:strokeColor="#241D1A"
                  android:strokeWidth="4" android:strokeLineCap="round"
                  android:pathData="M4,54 L104,54 M54,4 L54,104 M18,18 C40,34 40,74 18,90 M90,18 C68,34 68,74 90,90"/>
          </vector>
          EOF
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/ic_launcher"|' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze lib test --no-fatal-infos
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: nba-analytics-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish APK for in-app updates
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NBA Analytics build ${{ github.run_number }}
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
