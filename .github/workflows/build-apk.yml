name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set unique Android build number
        run: sed -i "s/^version:.*/version: 0.3.0+${GITHUB_RUN_NUMBER}/" pubspec.yaml
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --project-name nba_analytics .
      - name: Set NBA Analytics launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#10141D" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#EF6C35" android:pathData="M54,8 A46,46 0,1 0,54 100 A46,46 0,1 0,54 8"/>
              <path android:fillColor="@android:color/transparent" android:strokeColor="#20202A"
                  android:strokeWidth="3" android:pathData="M54,8 A46,46 0,1 0,54 100 A46,46 0,1 0,54 8"/>
              <path android:fillColor="@android:color/transparent" android:strokeColor="#20202A"
                  android:strokeWidth="3" android:pathData="M8,54h92 M54,8v92 M35,12 C58,34 58,74 35,96 M73,12 C50,34 50,74 73,96"/>
              <path android:fillColor="#1769AA" android:pathData="M83,70 A15,15 0,1 0,83 100 A15,15 0,1 0,83 70"/>
              <path android:fillColor="@android:color/transparent" android:strokeColor="#FFFFFF"
                  android:strokeWidth="3.2" android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M75,92 L83,77 L91,92 M78,87h10"/>
          </vector>
          EOF
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/ic_launcher"|' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' android/app/src/main/AndroidManifest.xml
      - run: rm -rf test
      - run: flutter pub get
      - run: flutter analyze lib --no-fatal-infos
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: nba-analytics-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish APK for in-app updates
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NBA Analytics build ${{ github.run_number }}
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
