name: NBA Data Source Probe

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: nba-data-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check NBA data sources
        run: python scripts/source_healthcheck.py
      - name: Save source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: nba-source-snapshot-${{ github.run_id }}
          path: data/
          retention-days: 14
